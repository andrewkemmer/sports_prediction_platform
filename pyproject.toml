[project]
name = "sports-prediction-platform"
version = "0.1.0"
description = "Multi-sport prediction platform (MLB, NFL, NHL, NBA) — scaffold phase."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "duckdb>=1.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.40",
    "altair>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "sports*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
