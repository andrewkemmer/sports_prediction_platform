  - tests/fixtures/raw_store/nba.parquet
  - tests/fixtures/raw_store/nfl.parquet
  - tests/fixtures/raw_store/nhl.parquet

files:
  # --- package plumbing ---
  - path: tests/__init__.py
    class: support
    description: package marker
  - path: tests/core/__init__.py
    class: support
    description: core test subpackage marker
  - path: tests/mlb/__init__.py
    class: support
    description: MLB test subpackage marker (GUARDRAILS §16, r0)
