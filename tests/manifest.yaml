  # Bounded committed raw datasets backing the permanent fold/matrix evidence
  # tests (Phase 7.5e-A rebaseline). One compact Parquet per sport; read-only
  # inputs for tests/raw_store.py, reproducible from the per-sport support
  # modules' evidence_frame() builders.
