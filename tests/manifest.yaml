# tests/manifest.yaml — closed allowlist for the tests/ tree (Phase 7.5c1).
#
# Every .py file under tests/ has an entry. Non-Python support data under
# tests/fixtures/ is listed as a data family. Hygiene enforcement lives in
# tests/core/test_manifest_hygiene.py and runs inside the standard suite.
#
# Golden-hash note: permanent regression tests carry reviewed in-module
# static literals (fold counts, fingerprint payload hash, matrix hashes).
# Tests never regenerate, rewrite, or persist these values; any literal
# change requires explicit reviewer approval in the phase report before
# commit. There is NO baseline JSON, NO docs/audits/, and NO durable
# evidence/hash file anywhere in the repository.

version: 1
classes: [production, governance, support]

required_topics:
  - imports_and_syntax
  - date_validation
  - start_end_semantics
  - full_repull_semantics
  - duckdb_schema
  - point_in_time_correctness
  - leakage_prevention
  - fold_determinism
  - oof_population
  - feature_contract_validation
  - model_output_schema
  - moneyline_probability_range
  - score_distribution_normalization
  - p_push
  - p_tie
  - market_normalization
  - artifact_schemas
  - frontend_compatibility
  - incremental_cache_updates
  - full_repull_behavior
  - retention_allowlist
  - safe_deletion

forbidden_name_tokens:
  [debug, probe, verify_, check_, adhoc, oneoff, one_off, scratch, tmp,
   experiment, ablation, evidence, report, phase]
forbidden_name_date_pattern: '(^|[_-])20\d{2}(\d{2})?([_.-]|$)'

# Non-Python support data (exempt from the filename token/date rules):
# only under tests/fixtures/.
fixtures_data:
  - tests/fixtures/mlb_artifact_schemas.json
  - tests/fixtures/nba_artifact_schemas.json
