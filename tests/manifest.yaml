  # --- golden-literal evidence tests (Phase 7.5b; values are in-module
  # --- reviewed static literals, never regenerated) ---
  - path: tests/core/test_fold_fingerprints.py
    class: production
    description: >
      Fold fingerprints recomputed per sport from the committed bounded raw
      fixtures against pinned in-module incumbents (MLB 10, NBA 23, NFL 54,
      NHL 23; payload hash pinned); also proves the committed fixtures still
      match their generators.
    topics: [fold_determinism]
  - path: tests/core/test_matrix_hashes.py
    class: production
    description: >
      All 8 scope feature-matrix hashes recomputed from the committed bounded
      raw fixtures against pinned in-module incumbents.
    topics: [feature_contract_validation]

