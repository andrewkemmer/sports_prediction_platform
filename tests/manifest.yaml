  - tests/fixtures/sample_artifacts/nfl/nfl_run_engine_markets_20270106.csv
  - tests/fixtures/sample_artifacts/nfl/nfl_run_engine_markets_20270106.meta.json
  - tests/fixtures/sample_artifacts/nfl/nfl_run_engine_monitor_20270106.json
  - tests/fixtures/sample_artifacts/nfl/nfl_shap_game_20270106_202601BUFKC.csv
