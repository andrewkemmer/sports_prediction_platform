# MLB data-source policy (spec §5; consumed by sports/mlb/ingestion).
#
# Declares the external sources, their REQUIRED payload columns (schema
# drift fails loudly), and the transport policy (chunk retries/backoff,
# incremental refresh tail). Values mirror the pre-r4 code constants —
# this file makes them configurable without touching transport code.
sport: mlb
data_sources_version: mlb_v1

sources:
  statcast:
    source_id: "mlb:pybaseball.statcast"
    required_columns:
      - game_date
      - game_pk
      - game_type
      - home_team
      - away_team
      - at_bat_number
      - pitch_number
      - pitcher
      - batter
      - home_score
      - away_score
  schedule:
    # Free MLB StatsAPI schedule — the source-populated first-pitch
    # instant (gameDate) that Statcast does NOT carry. The r10 live
    # smoke run proved the §7.1 instant gates cannot be satisfied from
    # Statcast alone; the schedule is merged onto the feature frame by
    # game_pk. Required columns are the NORMALIZED row contract.
    source_id: "mlb:statsapi.mlb.com/schedule"
    required_columns:
      - game_pk
      - game_date
      - start_time_utc

policy:
  chunk_retries: 3
  chunk_retry_base_ms: 1000
  # Re-pull this many trailing days on every resume so games captured
  # mid-game (partial Statcast posts) get their real finals.
  refresh_tail_days: 3
